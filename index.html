<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Closing...</title>
  <script>
    window.addEventListener("load", function () {
      window.close();
    });
  </script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: #eee;
    }
  </style>
</head>
<body>
  <p>This tab is closing. If it doesn't, you can close it yourself.</p>
</body>
</html>
